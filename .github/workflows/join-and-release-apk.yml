name: Join and Release APK

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Successful Build preinstalled Ubuntu Desktop APK run ID"
        required: true
        type: string
  workflow_run:
    workflows:
      - Build preinstalled Ubuntu Desktop APK
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  join-and-release:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_sha == github.sha) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download APK part 1
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
          name: Ubuntu-Desktop-APK-Part-1
          path: parts/one
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK part 2
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
          name: Ubuntu-Desktop-APK-Part-2
          path: parts/two
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK part 3
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
          name: Ubuntu-Desktop-APK-Part-3
          path: parts/three
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download APK checksums
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event_name == 'workflow_dispatch' && inputs.build_run_id || github.event.workflow_run.id }}
          name: Ubuntu-Desktop-APK-Checksums
          path: parts/checksums
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Join APK parts and verify package, rootfs and checksum
        shell: bash
        run: |
          set -euo pipefail
          find parts -type f -printf '%p %s bytes\\n'
          part1="$(find parts/one -type f -name '*.part' -print -quit)"
          part2="$(find parts/two -type f -name '*.part' -print -quit)"
          part3="$(find parts/three -type f -name '*.part' -print -quit)"
          checksum_file="$(find parts/checksums -type f -name 'Ubuntu-Desktop-Android11plus.apk.sha256' -print -quit)"
          test -s "$part1"
          test -s "$part2"
          test -s "$part3"
          test -s "$checksum_file"
          cat "$part1" "$part2" "$part3" > Ubuntu-Desktop-Android11plus.apk
          size="$(stat -c %s Ubuntu-Desktop-Android11plus.apk)"
          echo "Joined APK size: $size bytes"
          test "$size" -gt 200000000

          file Ubuntu-Desktop-Android11plus.apk
          unzip -t Ubuntu-Desktop-Android11plus.apk | tail -2
          unzip -Z1 Ubuntu-Desktop-Android11plus.apk | grep -Fx 'assets/ubuntu-rootfs.dat'
          unzip -Z1 Ubuntu-Desktop-Android11plus.apk | grep -Fx 'assets/ubuntu-desktop-start.sh'
          unzip -Z1 Ubuntu-Desktop-Android11plus.apk | grep -E '^lib/arm64-v8a/libproot(-loader)?[.]so
          unzip -p Ubuntu-Desktop-Android11plus.apk assets/ubuntu-rootfs.dat | tar -tzf - > rootfs-files.txt
          grep -E 'usr/share/backgrounds/ubuntu-lite/garuda-inspired[.]svg$' rootfs-files.txt
          grep -E 'usr/local/bin/ubuntu-lite-desktop-init[.]sh$' rootfs-files.txt
          if grep -Eq 'usr/bin/soffice$' rootfs-files.txt; then
            echo "LibreOffice must remain excluded until desktop startup is stable." >&2
            exit 1
          fi
          sha256sum --check "$checksum_file"
          grep -E 'usr/bin/firefox$|usr/lib/firefox/firefox
          sha256sum Ubuntu-Desktop-Android11plus.apk

      - name: Publish installable APK as GitHub Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ubuntu-desktop-apk-v1
          name: Ubuntu Desktop Android APK
          body: |
            Prebuilt ARM64 Ubuntu desktop APK for Android 11+ (no root).
            Size depends on the included desktop components. Requires several GB of free storage for extraction.
            Build archive and SHA-256 validation performed by GitHub Actions.
            Device runtime testing must still be confirmed on a physical Android device.
          overwrite_files: true
          fail_on_unmatched_files: true
          files: Ubuntu-Desktop-Android11plus.apk

          unzip -Z1 Ubuntu-Desktop-Android11plus.apk | grep -Fx 'lib/arm64-v8a/libXlorie.so'

          unzip -p Ubuntu-Desktop-Android11plus.apk assets/ubuntu-rootfs.dat | tar -tzf - > rootfs-files.txt
          grep -E 'usr/share/backgrounds/ubuntu-lite/garuda-inspired[.]svg$' rootfs-files.txt
          grep -E 'usr/local/bin/ubuntu-lite-desktop-init[.]sh$' rootfs-files.txt
          if grep -Eq 'opt/firefox/firefox$' rootfs-files.txt; then
            echo "Firefox must remain excluded until desktop startup is stable." >&2
            exit 1
          fi
          if grep -Eq 'usr/bin/soffice$' rootfs-files.txt; then
            echo "LibreOffice must remain excluded until desktop startup is stable." >&2
            exit 1
          fi
          sha256sum --check "$checksum_file"
          echo "APK archive, bundled Ubuntu rootfs, startup script, theme, native runtime and SHA-256 verified."
          sha256sum Ubuntu-Desktop-Android11plus.apk

      - name: Publish installable APK as GitHub Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ubuntu-desktop-apk-v1
          name: Ubuntu Desktop Android APK
          body: |
            Prebuilt ARM64 Ubuntu desktop APK for Android 11+ (no root).
            Size depends on the included desktop components. Requires several GB of free storage for extraction.
            Build archive and SHA-256 validation performed by GitHub Actions.
            Device runtime testing must still be confirmed on a physical Android device.
          overwrite_files: true
          fail_on_unmatched_files: true
          files: Ubuntu-Desktop-Android11plus.apk
 rootfs-files.txt
          if grep -Eq 'usr/bin/Xtigervnc$|usr/bin/Xvnc$|usr/bin/websockify$|usr/share/novnc/' rootfs-files.txt; then
            echo "VNC/noVNC stack must not be included." >&2
            exit 1
          fi
          echo "Native X11 library, Firefox, Ubuntu rootfs and SHA-256 verified."
          sha256sum Ubuntu-Desktop-Android11plus.apk

      - name: Publish installable APK as GitHub Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ubuntu-desktop-apk-v1
          name: Ubuntu Desktop Android APK
          body: |
            Prebuilt ARM64 Ubuntu desktop APK for Android 11+ (no root).
            Size depends on the included desktop components. Requires several GB of free storage for extraction.
            Build archive and SHA-256 validation performed by GitHub Actions.
            Device runtime testing must still be confirmed on a physical Android device.
          overwrite_files: true
          fail_on_unmatched_files: true
          files: Ubuntu-Desktop-Android11plus.apk

          unzip -Z1 Ubuntu-Desktop-Android11plus.apk | grep -Fx 'lib/arm64-v8a/libXlorie.so'

          unzip -p Ubuntu-Desktop-Android11plus.apk assets/ubuntu-rootfs.dat | tar -tzf - > rootfs-files.txt
          grep -E 'usr/share/backgrounds/ubuntu-lite/garuda-inspired[.]svg$' rootfs-files.txt
          grep -E 'usr/local/bin/ubuntu-lite-desktop-init[.]sh$' rootfs-files.txt
          if grep -Eq 'opt/firefox/firefox$' rootfs-files.txt; then
            echo "Firefox must remain excluded until desktop startup is stable." >&2
            exit 1
          fi
          if grep -Eq 'usr/bin/soffice$' rootfs-files.txt; then
            echo "LibreOffice must remain excluded until desktop startup is stable." >&2
            exit 1
          fi
          sha256sum --check "$checksum_file"
          echo "APK archive, bundled Ubuntu rootfs, startup script, theme, native runtime and SHA-256 verified."
          sha256sum Ubuntu-Desktop-Android11plus.apk

      - name: Publish installable APK as GitHub Release asset
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ubuntu-desktop-apk-v1
          name: Ubuntu Desktop Android APK
          body: |
            Prebuilt ARM64 Ubuntu desktop APK for Android 11+ (no root).
            Size depends on the included desktop components. Requires several GB of free storage for extraction.
            Build archive and SHA-256 validation performed by GitHub Actions.
            Device runtime testing must still be confirmed on a physical Android device.
          overwrite_files: true
          fail_on_unmatched_files: true
          files: Ubuntu-Desktop-Android11plus.apk
