name: Android virtual smoke test

on:
  workflow_dispatch:
  push:
    branches: [native-x11-display]
    paths:
      - '.github/workflows/android-virtual-smoke-test.yml'

permissions:
  contents: read

concurrency:
  group: android-virtual-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  emulator-smoke-test:
    name: Install, launch, and capture ARM64 Android screen
    # macos-latest is the current Apple Silicon (ARM64) hosted runner, so the ARM64 AVD
    # and the app's arm64-v8a native libraries use the same CPU architecture.
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - name: Download published native-X11 preview APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/virtual-device
          curl --fail --location --retry 3 \
            'https://github.com/aqibjavaidkhan/ubuntu-lite-android/releases/download/ubuntu-desktop-native-x11-1c98783/Ubuntu-Desktop-Android11plus.apk' \
            --output /tmp/Ubuntu-Desktop-Android11plus.apk
          test -s /tmp/Ubuntu-Desktop-Android11plus.apk
          ls -lh /tmp/Ubuntu-Desktop-Android11plus.apk
          shasum -a 256 /tmp/Ubuntu-Desktop-Android11plus.apk | tee artifacts/virtual-device/apk-sha256.txt

      - name: Boot Android 11 ARM64 virtual device and smoke-test app
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          system-image-api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_2
          emulator-boot-timeout: 900
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -accel off -memory 3072 -partition-size 8192
          disable-animations: true
          script: |
            set -euo pipefail
            mkdir -p artifacts/virtual-device
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            PACKAGE='com.ubuntulite.desktop'
            echo "Checking emulator and APK package ID..."
            adb shell getprop ro.build.version.release | tr -d '\r' | tee artifacts/virtual-device/android-version.txt
            adb install -r /tmp/Ubuntu-Desktop-Android11plus.apk
            adb shell pm list packages | grep -Fx "package:$PACKAGE"
            adb shell appops set "$PACKAGE" MANAGE_EXTERNAL_STORAGE allow || true

            echo "Launching Ubuntu Desktop..."
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 45

            adb shell dumpsys activity activities > artifacts/virtual-device/activities.txt
            adb logcat -d -t 20000 > artifacts/virtual-device/logcat.txt
            adb exec-out screencap -p > artifacts/virtual-device/ubuntu-desktop-screen.png
            test -s artifacts/virtual-device/ubuntu-desktop-screen.png

            echo "Top/resumed activity:"
            grep -E 'mResumedActivity|topResumedActivity' artifacts/virtual-device/activities.txt || true
            if ! grep -F "$PACKAGE" artifacts/virtual-device/activities.txt; then
              echo "Ubuntu package was not found in the active activity dump." >&2
              exit 1
            fi
            if grep -E 'FATAL EXCEPTION|Fatal signal' artifacts/virtual-device/logcat.txt; then
              echo "Fatal error signature detected in emulator logcat." >&2
              exit 1
            fi
            echo "Install-and-launch smoke test passed. The saved screenshot still requires visual review; full Linux desktop rendering, network, audio, and Bluetooth are not certified by this test."

      - name: Upload virtual-device screenshot and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-desktop-virtual-device-evidence
          path: artifacts/virtual-device/
          if-no-files-found: warn
          retention-days: 7
