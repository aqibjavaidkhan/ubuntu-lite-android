name: Android virtual smoke test

on:
  workflow_dispatch:
  push:
    branches: [native-x11-display]
    paths:
      - '.github/workflows/android-virtual-smoke-test.yml'

permissions:
  contents: read

concurrency:
  group: android-virtual-smoke-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  launcher-smoke-test:
    name: Boot Android and verify launcher startup
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Download published native-X11 preview APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/virtual-device
          curl --fail --location --retry 3 \
            'https://github.com/aqibjavaidkhan/ubuntu-lite-android/releases/download/ubuntu-desktop-native-x11-1c98783/Ubuntu-Desktop-Android11plus.apk' \
            --output /tmp/Ubuntu-Desktop-Android11plus.apk
          test -s /tmp/Ubuntu-Desktop-Android11plus.apk
          ls -lh /tmp/Ubuntu-Desktop-Android11plus.apk
          sha256sum /tmp/Ubuntu-Desktop-Android11plus.apk | tee artifacts/virtual-device/apk-sha256.txt

      - name: Install APK and check launcher startup
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          system-image-api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-boot-timeout: 600
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -memory 4096 -partition-size 8192
          disable-animations: true
          script: |
            set -eu
            mkdir -p artifacts/virtual-device
            adb wait-for-device
            adb shell settings put global window_animation_scale 0
            adb shell settings put global transition_animation_scale 0
            adb shell settings put global animator_duration_scale 0

            PACKAGE='com.ubuntulite.desktop'
            echo "Android version, ABI and native bridge:"
            adb shell getprop ro.build.version.release | tr -d '\r' | tee artifacts/virtual-device/android-version.txt
            adb shell getprop ro.product.cpu.abilist | tr -d '\r' | tee artifacts/virtual-device/device-abis.txt
            adb shell getprop ro.dalvik.vm.native.bridge | tr -d '\r' | tee artifacts/virtual-device/native-bridge.txt

            echo "Installing APK..."
            adb install -r /tmp/Ubuntu-Desktop-Android11plus.apk
            adb shell pm list packages | grep -Fx "package:$PACKAGE"
            adb shell appops set "$PACKAGE" MANAGE_EXTERNAL_STORAGE allow || true

            echo "Launching launcher..."
            adb logcat -c
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 12
            adb logcat -d -t 30000 > artifacts/virtual-device/launcher-logcat.txt
            adb shell dumpsys activity activities > artifacts/virtual-device/launcher-activities.txt
            adb exec-out screencap -p > artifacts/virtual-device/launcher-screen.png

            if grep -E 'FATAL EXCEPTION|Fatal signal|Process: com.ubuntulite.desktop' artifacts/virtual-device/launcher-logcat.txt; then
              echo "Launcher crash detected; screenshot and logcat are saved as artifacts." >&2
              exit 1
            fi
            if ! grep -E 'mResumedActivity|topResumedActivity' artifacts/virtual-device/launcher-activities.txt | grep -q 'com.ubuntulite.launcher.MainActivity'; then
              echo "Launcher did not remain in the foreground for 12 seconds." >&2
              cat artifacts/virtual-device/launcher-activities.txt >&2
              exit 1
            fi
            echo "PASS: launcher stayed in the foreground for 12 seconds without a fatal crash."

      - name: Upload virtual-device screenshot and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ubuntu-desktop-virtual-device-evidence
          path: artifacts/virtual-device/
          if-no-files-found: warn
          retention-days: 7
