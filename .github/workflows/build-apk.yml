name: Build preinstalled Ubuntu Desktop APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.9-bin.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils patchelf dpkg-dev xz-utils qemu-user-static

      - name: Enable ARM64 image builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Build fully provisioned Ubuntu Desktop filesystem
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 -f tools/ubuntu-desktop/Dockerfile -t ubuntu-lite-preinstalled:22.04 .
          cid="$(docker create --platform linux/arm64 ubuntu-lite-preinstalled:22.04)"
          mkdir -p app/src/main/assets
          docker export "$cid" | gzip -1 > app/src/main/assets/ubuntu-rootfs.dat
          docker rm "$cid"
          test -s app/src/main/assets/ubuntu-rootfs.dat
          echo "Bundled rootfs size:"
          ls -lh app/src/main/assets/ubuntu-rootfs.dat
          tar -tzf app/src/main/assets/ubuntu-rootfs.dat > /tmp/ubuntu-rootfs-files.txt
          grep -q 'root/.ubuntu-preinstalled-desktop-v1' /tmp/ubuntu-rootfs-files.txt
          grep -q 'opt/firefox/firefox' /tmp/ubuntu-rootfs-files.txt
          grep -q 'usr/bin/soffice' /tmp/ubuntu-rootfs-files.txt
          grep -q 'usr/sbin/synaptic' /tmp/ubuntu-rootfs-files.txt
          echo "Confirmed: preinstalled rootfs includes Firefox, LibreOffice, Synaptic and desktop marker."

      - name: Bundle ARM64 PRoot runtime
        run: python3 tools/fetch_native_runtime.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Assert Android 11+ target
        run: |
          grep -q 'minSdk 30' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle

      - name: Reuse debug signing key for installable updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ubuntu-lite-desktop-debug-keystore-v1

      - name: Build APK with Ubuntu already inside
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK is self-contained
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          unzip -l "$APK" | grep 'assets/ubuntu-rootfs.dat'
          unzip -l "$APK" | grep -E 'assets/ubuntu-desktop-start.sh'
          unzip -l "$APK" | grep -E 'lib/arm64-v8a/libproot.*\\.so'
          rootfs_bytes="$(unzip -l "$APK" | awk '$4=="assets/ubuntu-rootfs.dat" {print $1}')"
          echo "Preinstalled rootfs compressed size in APK: $rootfs_bytes bytes"
          test "$rootfs_bytes" -gt 100000000
          echo "APK contains the preinstalled Ubuntu desktop rootfs (not just Ubuntu Base)."

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Desktop-Preinstalled-ARM64-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
