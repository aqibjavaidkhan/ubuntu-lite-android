name: Build preinstalled Ubuntu Desktop APK
run-name: Build themed lightweight Ubuntu APK

on:
  workflow_dispatch:
  push:
    branches: [main, native-x11-display]
    paths:
      - 'settings.gradle'
      - 'build.gradle'
      - 'app/build.gradle'
      - 'gradle.properties'
      - 'tools/prepare_native_x11.py'
      - 'native-x11-support/**'
      - '.github/workflows/join-and-release-apk.yml'
      - 'app/src/main/java/**'
      - 'app/src/main/AndroidManifest.xml'
      - 'app/src/main/res/**'
      - 'app/src/main/assets/ubuntu-desktop-start.sh'
      - 'tools/ubuntu-desktop/Dockerfile'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build-arm64-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Prepare pinned native X11 renderer
        run: python3 tools/prepare_native_x11.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-9.8.2-all.zip -o /tmp/gradle.zip
          sudo unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.8.2/bin" >> "$GITHUB_PATH"

      - name: Install native tools
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils patchelf dpkg-dev xz-utils qemu-user-static bison flex git ninja-build patch autoconf automake libtool pkg-config python3

      - name: Enable ARM64 image builds
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Restore preinstalled Ubuntu desktop rootfs cache
        id: restore-rootfs
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/ubuntu-rootfs.dat
          key: ubuntu-preinstalled-rootfs-v3-${{ hashFiles('tools/ubuntu-desktop/Dockerfile') }}

      - name: Build lightweight Ubuntu Desktop filesystem
        id: build-rootfs
        if: steps.restore-rootfs.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/arm64 -f tools/ubuntu-desktop/Dockerfile -t ubuntu-lite-preinstalled:22.04 .
          cid="$(docker create --platform linux/arm64 ubuntu-lite-preinstalled:22.04)"
          trap 'docker rm -f "$cid" >/dev/null 2>&1 || true' EXIT
          mkdir -p app/src/main/assets
          docker export "$cid" | gzip -1 > app/src/main/assets/ubuntu-rootfs.dat
          docker rm "$cid"
          test -s app/src/main/assets/ubuntu-rootfs.dat
          echo "Preinstalled Ubuntu filesystem size:"
          ls -lh app/src/main/assets/ubuntu-rootfs.dat

      - name: Verify preinstalled Ubuntu desktop contents
        shell: bash
        run: |
          set -euo pipefail
          ROOTFS=app/src/main/assets/ubuntu-rootfs.dat
          test -s "$ROOTFS"
          tar -tzf "$ROOTFS" | awk '
            index($0, "root/.ubuntu-preinstalled-desktop-v1") { marker=1 }
            index($0, "usr/sbin/synaptic") { synaptic=1 }
            index($0, "usr/bin/plank") { plank=1 }
            index($0, "usr/share/backgrounds/ubuntu-lite/garuda-inspired.svg") { wallpaper=1 }
            index($0, "usr/local/bin/ubuntu-lite-desktop-init.sh") { theme_init=1 }
            index($0, "usr/bin/firefox") || index($0, "usr/lib/firefox/firefox") { firefox=1 }
            index($0, "usr/bin/Xtigervnc") || index($0, "usr/bin/Xvnc") || index($0, "usr/bin/websockify") || index($0, "usr/share/novnc/") { vnc=1 }
            END {
              if (!marker || !synaptic || !plank || !wallpaper || !theme_init || !firefox || vnc) {
                print "Rootfs verification failed: marker=" marker ", synaptic=" synaptic ", plank=" plank ", wallpaper=" wallpaper ", theme_init=" theme_init ", firefox=" firefox ", vnc=" vnc > "/dev/stderr"
                exit 1
              }
              print "Verified native-X11 Ubuntu XFCE: desktop, Firefox and theme present; VNC/noVNC components absent."
            }
          '

      - name: Save preinstalled Ubuntu desktop rootfs cache
        if: steps.restore-rootfs.outputs.cache-hit != 'true' && steps.build-rootfs.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/ubuntu-rootfs.dat
          key: ubuntu-preinstalled-rootfs-v2-${{ hashFiles('tools/ubuntu-desktop/Dockerfile') }}

      - name: Bundle ARM64 PRoot runtime
        run: python3 tools/fetch_native_runtime.py

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Install Android platform and build tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;29.0.14206865" "cmake;3.22.1"

      - name: Assert Android 11+ target
        run: |
          grep -q 'minSdk 30' app/build.gradle
          grep -q 'targetSdk 35' app/build.gradle

      - name: Reuse debug signing key for installable updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: ubuntu-lite-desktop-debug-keystore-v1

      - name: Build APK with Ubuntu already inside
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK is self-contained
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          unzip -Z1 "$APK" | grep -Fx 'assets/ubuntu-rootfs.dat'
          unzip -Z1 "$APK" | grep -Fx 'assets/ubuntu-desktop-start.sh'
          unzip -Z1 "$APK" | grep -E '^lib/arm64-v8a/libproot(-loader)?\.so          rootfs_bytes="$(unzip -l "$APK" | awk '$4=="assets/ubuntu-rootfs.dat" {print $1}')"
          echo "Preinstalled rootfs compressed size in APK: $rootfs_bytes bytes"
          test "$rootfs_bytes" -gt 100000000
          if unzip -p "$APK" assets/ubuntu-rootfs.dat | tar -tzf - | grep -Eq 'usr/bin/Xtigervnc$|usr/bin/Xvnc$|usr/bin/websockify$|usr/share/novnc/'; then
            echo "VNC/noVNC stack must not be included in the native-display build." >&2
            exit 1
          fi
          echo "APK contains Ubuntu XFCE, Firefox, native X11 renderer and no VNC/noVNC stack."

      - name: Split APK for download
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p /tmp/ubuntu-apk-parts
          apk_size="$(stat -c%s "$APK")"
          chunk_size="$(( (apk_size + 2) / 3 ))"
          split -b "$chunk_size" -d --additional-suffix=.part "$APK" /tmp/ubuntu-apk-parts/ubuntu-desktop-
          part_count="$(find /tmp/ubuntu-apk-parts -maxdepth 1 -name 'ubuntu-desktop-*.part' | wc -l)"
          test "$part_count" -eq 3
          (cd /tmp/ubuntu-apk-parts && sha256sum ubuntu-desktop-*.part > SHA256SUMS.parts)
          sha256sum "$APK" | awk '{print $1 "  Ubuntu-Desktop-Android11plus.apk"}' > /tmp/ubuntu-apk-parts/Ubuntu-Desktop-Android11plus.apk.sha256
          echo "Split installable APK into $part_count downloadable parts."
          ls -lh /tmp/ubuntu-apk-parts

      - name: Upload APK part 1
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Desktop-APK-Part-1
          path: /tmp/ubuntu-apk-parts/ubuntu-desktop-00.part
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK part 2
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Desktop-APK-Part-2
          path: /tmp/ubuntu-apk-parts/ubuntu-desktop-01.part
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK part 3
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Desktop-APK-Part-3
          path: /tmp/ubuntu-apk-parts/ubuntu-desktop-02.part
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK checksums
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Desktop-APK-Checksums
          path: |
            /tmp/ubuntu-apk-parts/SHA256SUMS.parts
            /tmp/ubuntu-apk-parts/Ubuntu-Desktop-Android11plus.apk.sha256
          if-no-files-found: error
          retention-days: 14

          unzip -Z1 "$APK" | grep -Fx 'lib/arm64-v8a/libXlorie.so'
          rootfs_bytes="$(unzip -l "$APK" | awk '$4=="assets/ubuntu-rootfs.dat" {print $1}')"
          echo "Preinstalled rootfs compressed size in APK: $rootfs_bytes bytes"
          test "$rootfs_bytes" -gt 100000000
          echo "APK contains the preinstalled Ubuntu desktop rootfs (not just Ubuntu Base)."

      - name: Split APK for download
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          mkdir -p /tmp/ubuntu-apk-parts
          apk_size="$(stat -c%s "$APK")"
          chunk_size="$(( (apk_size + 2) / 3 ))"
          split -b "$chunk_size" -d --additional-suffix=.part "$APK" /tmp/ubuntu-apk-parts/ubuntu-desktop-
          part_count="$(find /tmp/ubuntu-apk-parts -maxdepth 1 -name 'ubuntu-desktop-*.part' | wc -l)"
          test "$part_count" -eq 3
          (cd /tmp/ubuntu-apk-parts && sha256sum ubuntu-desktop-*.part > SHA256SUMS.parts)
          sha256sum "$APK" | awk '{print $1 "  Ubuntu-Desktop-Android11plus.apk"}' > /tmp/ubuntu-apk-parts/Ubuntu-Desktop-Android11plus.apk.sha256
          echo "Split installable APK into $part_count downloadable parts."
          ls -lh /tmp/ubuntu-apk-parts

      - name: Upload APK part 1
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Desktop-APK-Part-1
          path: /tmp/ubuntu-apk-parts/ubuntu-desktop-00.part
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK part 2
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Desktop-APK-Part-2
          path: /tmp/ubuntu-apk-parts/ubuntu-desktop-01.part
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK part 3
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Desktop-APK-Part-3
          path: /tmp/ubuntu-apk-parts/ubuntu-desktop-02.part
          if-no-files-found: error
          retention-days: 14

      - name: Upload APK checksums
        uses: actions/upload-artifact@v4
        with:
          name: Ubuntu-Desktop-APK-Checksums
          path: |
            /tmp/ubuntu-apk-parts/SHA256SUMS.parts
            /tmp/ubuntu-apk-parts/Ubuntu-Desktop-Android11plus.apk.sha256
          if-no-files-found: error
          retention-days: 14
