plugins { id 'com.android.application' }

android {
    namespace 'com.ubuntulite.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ubuntulite.desktop'
        minSdk 30
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a' }
    }
    packaging { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
}
