plugins { id 'com.android.application' }

android {
    namespace 'com.ubuntulite.launcher'
    compileSdk 36
    defaultConfig {
        applicationId 'com.ubuntulite.desktop'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '1.0.1'
        ndk { abiFilters 'arm64-v8a' }
    }
    packaging { jniLibs { useLegacyPackaging true } }
    androidResources { noCompress += ['dat'] }
}

dependencies {
    implementation 'org.apache.commons:commons-compress:1.27.1'
    if (findProject(':lorie') != null) {
        implementation project(':lorie')
    }
}
